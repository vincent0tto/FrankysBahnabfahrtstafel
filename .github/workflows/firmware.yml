# Builds the firmware on every push to main and publishes it as release
# "build-<run number>", the number shown in the Actions tab. The board installs
# it after its next start (src/updater.cpp). Built without include/secrets.h: the releases are public,
# the board keeps its passwords in flash (src/credentials.cpp).
name: firmware

on:
  push:
    branches: [main]
    paths-ignore:  # pushes that only change docs don't make a new release
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: firmware
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Tests
        run: pio test -e native

      - name: Build
        run: pio run -e esp32s3

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}  # same as FW_BUILD (tools/version.py)
          if gh release view "build-$N" >/dev/null 2>&1; then echo "build-$N exists"; exit 0; fi
          gh release create "build-$N" .pio/build/esp32s3/firmware.bin \
            --target "$GITHUB_SHA" --title "build-$N" --notes "$(git log -1 --pretty=%s)"
          # keep the newest 10 releases
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
