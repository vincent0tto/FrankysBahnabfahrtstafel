; Frankys Bahnabfahrtstafel – rnv-style departure board
; ESP32-S3-DevKitC-1 N8R8 + 3x Waveshare 22100 (64x64, HUB75E, 1/32 scan)

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
; log output is on the CH343 "UART" serial port (the other port is the native USB/JTAG)
monitor_port = /dev/cu.usbmodem5B79*
monitor_filters = esp32_exception_decoder, time
extra_scripts = pre:tools/version.py, pre:tools/web_assets.py
build_flags =
    -DBOARD_HAS_PSRAM
    ; amber text needs few colour levels -> less data per frame, so the slow
    ; (clean) HUB75 clock below still gives a steady ~150 Hz refresh
    -DPIXEL_COLOR_DEPTH_BITS=4
    ; HUB75 clock on the ESP32-S3 = 160 MHz / S3_LCD_DIV_NUM. The library's
    ; slowest regular setting is 16 (10 MHz). 24 = 6.7 MHz: no wrong-colour
    ; pixels over the jumper wires here (16 and 20 had some). Refresh at 24 with
    ; 4-bit colour is ~150 Hz; 32 (5 MHz) would still give ~110 Hz.
    -DS3_LCD_DIV_NUM=24
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15
    adafruit/Adafruit GFX Library@1.12.6
    bblanchon/ArduinoJson@7.4.3
    olikraus/U8g2_for_Adafruit_GFX@1.8.0

; Over-the-air update after the first USB flash:
;   pio run -e esp32s3-ota -t upload
[env:esp32s3-ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = abfahrtstafel.local
; must match OTA_PASSWORD in include/secrets.h
upload_flags = --auth=${sysenv.ABFAHRT_OTA_PASSWORD}

; Host-side unit tests for the parser/formatter, settings, event, karaoke list, log buffer, race and match: pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -DNATIVE_TEST
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    olikraus/U8g2_for_Adafruit_GFX@1.8.0
build_src_filter = -<*> +<departures/parse.cpp> +<core/settings.cpp> +<event/event.cpp> +<karaoke/karaoke.cpp> +<display/icons.cpp> +<core/log_ring.cpp> +<race/race.cpp> +<match/match.cpp>
test_build_src = yes
